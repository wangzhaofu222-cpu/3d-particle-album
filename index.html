<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Particle Album</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="cards-container"></div>

  <!-- Brand mark -->
  <div id="brand-mark">
    <span class="brand-name">WZF</span>
    <svg class="brand-heart" viewBox="0 0 32 29" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 28.5C14.3 27.2 2.5 18.5 2.5 9.5 2.5 4.3 6.3 0.5 11.5 0.5c3 0 5.5 1.5 7 3.5 1.5-2 4-3.5 7-3.5C28.7 0.5 29.5 4.3 29.5 9.5c0 9-11.8 17.7-13.5 19z" fill="url(#hg)"/>
      <defs><linearGradient id="hg" x1="2.5" y1="0.5" x2="29.5" y2="28.5"><stop stop-color="#ff7eb3"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient></defs>
    </svg>
    <span class="brand-name">LQP</span>
  </div>

  <!-- Layout switcher -->
  <nav id="layout-bar">
    <button data-layout="arrival" class="active">散落</button>
    <button data-layout="cross">十字</button>
    <button data-layout="gather">聚拢</button>
    <button data-layout="fan">扇形</button>
    <button data-layout="spiral">螺旋</button>
    <button data-layout="depart">圆环</button>
    <button data-layout="wave">波浪</button>
    <button data-layout="dna">双螺旋</button>
    <button data-layout="sphere">球体</button>
    <span class="bar-divider"></span>
    <button id="auto-play-btn">自动播放</button>
  </nav>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-card">
      <img id="modal-img" src="" alt="" />
      <div id="modal-caption"></div>
      <button id="modal-close">&times;</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

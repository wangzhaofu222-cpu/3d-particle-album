<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Particle Album</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="cards-container"></div>

  <!-- Brand mark -->
  <div id="brand-mark">
    <span class="brand-name">WZF</span>
    <svg class="brand-heart" viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 27C14.3 25.8 2.5 17.5 2.5 9 2.5 4.1 6.3 0.5 11.5 0.5c3 0 5.5 1.4 7 3.3 1.5-1.9 4-3.3 7-3.3C28.7 0.5 29.5 4.1 29.5 9c0 8.5-11.8 16.8-13.5 18z" stroke="rgba(255,255,255,0.7)" stroke-width="1" fill="none"/>
    </svg>
    <span class="brand-name">LQP</span>
  </div>

  <!-- Layout switcher -->
  <nav id="layout-bar">
    <button data-layout="arrival" class="active">散落</button>
    <button data-layout="cross">十字</button>
    <button data-layout="gather">聚拢</button>
    <button data-layout="fan">扇形</button>
    <button data-layout="spiral">螺旋</button>
    <button data-layout="depart">圆环</button>
    <button data-layout="wave">波浪</button>
    <button data-layout="dna">双螺旋</button>
    <button data-layout="sphere">球体</button>
    <span class="bar-divider"></span>
    <button id="auto-play-btn">自动播放</button>
  </nav>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-card">
      <img id="modal-img" src="" alt="" />
      <div id="modal-caption"></div>
      <button id="modal-close">&times;</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
